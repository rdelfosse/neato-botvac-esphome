    name: Signal Wi-Fi
    update_interval: 60s
  # Suivi de l'alimentation de l'ESP : temps écoulé depuis son dernier démarrage.
  - platform: uptime
    name: Allumé depuis
    update_interval: 30s
  - platform: template
    id: distance_trajet
    name: Distance du trajet
    unit_of_measurement: m
    icon: mdi:map-marker-distance
    accuracy_decimals: 2
  - platform: template
    id: cap
    name: Cap
    unit_of_measurement: "°"
    icon: mdi:compass-outline
    accuracy_decimals: 0
  - platform: template
    id: distance_totale
    name: Distance totale
    unit_of_measurement: m
    icon: mdi:counter
    accuracy_decimals: 0
    state_class: total_increasing
  - platform: template
    id: puissance_aspiration
    name: Puissance d'aspiration
    unit_of_measurement: "%"
    icon: mdi:fan
    accuracy_decimals: 0
    lambda: return id(vac_pct);
    update_interval: never
  # Rapport Xbox (16 octets) : sticks gauche X/Y et droit X/Y sur 16 bits, gâchettes G/D sur 10 bits,
  # croix, boutons (A 0x01, B 0x02, X 0x08, Y 0x10, LB 0x40, RB 0x80), View/Menu/Xbox, Share.
  - platform: ble_client
    type: characteristic
    ble_client_id: manette
    id: manette_rapport
    internal: true
    service_uuid: "1812"
    characteristic_uuid: "2a4d"
    notify: true
    update_interval: never
    lambda: |-
      if (x.size() < 15) return (float) x.size();
      auto u16 = [&](int i) { return (int) (x[i] | (x[i + 1] << 8)); };
      id(pad_lx) = u16(0) - 32768;
      id(pad_ly) = u16(2) - 32768;
      id(pad_lt) = u16(8);
      id(pad_rt) = u16(10);
      uint32_t btn = x[13] | (x[14] << 8) | (x.size() > 15 ? (x[15] << 16) : 0);
      uint32_t pressed = btn & ~id(pad_btn);
      id(pad_btn) = btn;
      if (pressed & 0x01) id(start_drive).execute();
      if (pressed & 0x02) id(stop_drive).execute();
      if ((pressed & 0x10) && id(driving)) id(horn) = true;
      if ((pressed & 0x08) && id(driving)) {
        id(brush_on) = !id(brush_on);
        id(aux_cmd) += id(brush_on) ? "SetMotor Brush RPM 800\r\nSetMotor SideBrushEnable\r\nSetMotor SideBrushOn\r\n" : "SetMotor Brush RPM 0\r\nSetMotor SideBrushOff\r\n";
      }
      if ((pressed & 0x80) && id(driving)) {
        id(vac_on) = !id(vac_on);
        if (id(vac_on)) {
          char vb[48];
          snprintf(vb, sizeof(vb), "SetMotor VacuumOn VacuumSpeed %d\r\n", id(vac_pct));
          id(aux_cmd) += vb;
        } else {
          id(aux_cmd) += "SetMotor VacuumOff\r\n";
        }
      }
      // Croix (octet 12) : 1 haut, 5 bas ; à l'appui seulement.
      static int last_hat = 0;
      int hat = x[12];
      if (hat != last_hat && id(driving) && (hat == 1 || hat == 5)) {
        int pct = id(vac_pct) + (hat == 1 ? 20 : -20);
        pct = pct > 100 ? 100 : (pct < 20 ? 20 : pct);
        if (pct != id(vac_pct)) {
          id(vac_pct) = pct;
          id(puissance_aspiration).publish_state(pct);
          ESP_LOGI("manette", "Aspiration à %d %%", pct);
          if (id(vac_on)) {
            char vb[48];
            snprintf(vb, sizeof(vb), "SetMotor VacuumOn VacuumSpeed %d\r\n", pct);
            id(aux_cmd) += vb;
          }
        }
      }
      last_hat = hat;
      // Octets bruts pour vérifier la disposition : à chaque changement de bouton, sinon 1 fois/s.
      static uint32_t last_pub = 0;
      static uint32_t last_btn = 0xFFFFFFFF;
      if (btn != last_btn || millis() - last_pub > 1000) {
        last_pub = millis();
        last_btn = btn;
        char hex[64];
        int n = 0;
        for (size_t i = 0; i < x.size() && i < 20; i++) n += snprintf(hex + n, sizeof(hex) - n, "%02X ", x[i]);
        id(manette_brut).publish_state(std::string(hex, n > 0 ? n - 1 : 0));
      }
      return (float) x.size();

