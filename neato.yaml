interval:
  # Réponses du robot : lignes en Latin-1, terminées par 0x1A en fin de commande.
  - interval: 20ms
    then:
      - lambda: |-
          uint8_t c;
          // Une réponse peut finir par 0x1A sans retour à la ligne après sa dernière ligne
          // (ex. « SideBrush_mA,54 » en fin de GetMotors) : on traite d'abord cette ligne,
          // puis on rejoue le 0x1A pour clore la réponse.
          bool replay = false;
          while (replay || (id(neato_uart).available() > 0 && id(neato_uart).read_byte(&c))) {
            if (replay) {
              c = 0x1A;
              replay = false;
            } else {
              id(last_reply) = millis();
            }
            if (c == 0x1A && !id(rx).empty()) {
              c = '\n';
              replay = true;
            }
            if (c == 0x1A) {
              if (id(pending) == 2 && !id(err_seen)) id(erreur).publish_state("Aucune");
              if (id(pending) == 4) {
                id(laser_points).publish_state(id(lds_valid));
                if (id(lds_valid) > 0) id(lidar_publish).execute();
              }
              if (id(pending) == 7 && !id(soft_version).empty()) id(logiciel).publish_state(id(soft_version));
              if (id(pending) == 3) {
                bool working = id(rpm_vac) > 0 || id(rpm_brush) > 0;
                bool rolling = id(rpm_lw) != 0 || id(rpm_rw) != 0;
                bool forcing = (id(load_lw) > 70 && id(rpm_lw) == 0) || (id(load_rw) > 70 && id(rpm_rw) == 0);
                if (!id(coince).has_state() || id(coince).state != (working && forcing)) id(coince).publish_state(working && forcing);
                // Départ de la base : le trajet repart de zéro au moment où les roues démarrent, robot encore
                // sur la base. L'origine est alors la base, et le cap zéro la direction de sortie.
                // (Avant, la remise à zéro attendait l'aspiration : le robot avait déjà roulé et tourné.)
                static bool was_rolling = false;
                static uint32_t depart_ms = 0;
                if (rolling && !was_rolling && id(sur_base).has_state() && id(sur_base).state) {
                  id(trip_mm) = 0;
                  id(heading) = 0;
                  id(odo_x) = 0;
                  id(odo_y) = 0;
                  depart_ms = millis();
                }
                was_rolling = rolling;
                if (!id(en_nettoyage).has_state() || id(en_nettoyage).state != working) {
                  // Nettoyage lancé ailleurs que sur la base : le trajet repart de l'endroit où il commence.
                  bool depuis_base = depart_ms != 0 && millis() - depart_ms < 120000;
                  if (working && id(en_nettoyage).has_state() && !depuis_base) id(odo_reset).execute();
                  id(en_nettoyage).publish_state(working);
                }
                std::string act = working ? "nettoie" : rolling ? "roule" : "à l'arrêt";
                if (id(activite).state != act) id(activite).publish_state(act);
              }
              if (id(pending) == 3) id(odo_update).execute();
              if (id(pending) == 3 || id(pending) == 8) id(publish_direct).execute();
              id(pending) = 0;
              id(rx).clear();
              continue;
            }
            if (c == '\r') continue;
            if (c != '\n') {
              if (c < 0x80) {
                id(rx).push_back((char) c);
              } else {
                id(rx).push_back((char) (0xC0 | (c >> 6)));
                id(rx).push_back((char) (0x80 | (c & 0x3F)));
              }
              continue;
            }
            std::string line = id(rx);
            id(rx).clear();
            if (line.find("<Fast Memory>") != std::string::npos) {
              id(robot_booted) = true;
              continue;
            }
            auto value = [&](const char *key, std::string &out) {
              std::string k = std::string(key) + ",";
              if (line.rfind(k, 0) != 0) return false;
              out = line.substr(k.size());
              return true;
            };
            // « BotVacBasic,905-0285, » → « BotVacBasic 905-0285 »
            auto fields = [](std::string s) {
              while (!s.empty() && (s.back() == ',' || s.back() == ' ')) s.pop_back();
              for (auto &ch : s) if (ch == ',') ch = ' ';
              return s;
            };
            std::string v;
            if (id(pending) == 4) {
              // Lignes « angle,distance mm,intensité,erreur » puis « ROTATION_SPEED,5.12 ».
              if (value("ROTATION_SPEED", v)) {
                id(laser_vitesse).publish_state(atof(v.c_str()));
              } else if (!line.empty() && isdigit((unsigned char) line[0])) {
                int angle, dist, intensity, err;
                if (sscanf(line.c_str(), "%d,%d,%d,%x", &angle, &dist, &intensity, &err) == 4) {
                  if (id(lds_cm).size() != 360) id(lds_cm).assign(360, 0);
                  bool ok = err == 0 && dist > 0;
                  if (ok) id(lds_valid)++;
                  if (angle >= 0 && angle < 360) id(lds_cm)[angle] = ok ? std::min(dist / 10, 4095) : 0;
                }
              }
            } else if (id(pending) == 6) {
              if (line.find("No options specified") != std::string::npos) id(mode_test).publish_state(true);
              else if (line.find("TestMode must be on") != std::string::npos) id(mode_test).publish_state(false);
            } else if (id(pending) == 7) {
              if (value("Model", v)) id(modele).publish_state(fields(v));
              else if (value("Serial Number", v)) id(numero_serie).publish_state(fields(v));
              else if (value("Software", v)) {
                // « 1,2,1 » → « 1.2.1 »
                std::string s = fields(v);
                for (auto &ch : s) if (ch == ' ') ch = '.';
                id(soft_version) = s;
              }
            }
            else if (value("FuelPercent", v)) id(batterie).publish_state(atof(v.c_str()));
            else if (value("VBattV", v)) id(tension).publish_state(atof(v.c_str()));
            else if (value("BattTempCAvg", v)) id(temp_batterie).publish_state(atof(v.c_str()));
            else if (value("BatteryFailure", v)) id(batterie_defaut).publish_state(v == "1");
            else if (value("BatteryOverTemp", v)) id(batterie_surchauffe).publish_state(v == "1");
            else if (value("ConfidentOnFuel", v)) id(jauge_fiable).publish_state(v == "1");
            else if (value("OnReservedFuel", v)) id(batterie_reserve).publish_state(v == "1");
            else if (value("EmptyFuel", v)) id(batterie_vide).publish_state(v == "1");
            else if (value("ChargingActive", v)) id(en_charge).publish_state(v == "1");
            else if (value("ExtPwrPresent", v)) id(sur_base).publish_state(v == "1");
            else if (value("Brush_RPM", v)) id(rpm_brush) = atoi(v.c_str());
            else if (value("Brush_mA", v)) id(cur_brush) = atoi(v.c_str());
            else if (value("SideBrush_mA", v)) id(cur_side) = atoi(v.c_str());
            else if (value("Vacuum_mA", v)) id(cur_vac) = atoi(v.c_str());
            else if (value("Vacuum_RPM", v)) id(rpm_vac) = atoi(v.c_str());
            else if (value("LeftWheel_RPM", v)) id(rpm_lw) = atoi(v.c_str());
            else if (value("RightWheel_RPM", v)) id(rpm_rw) = atoi(v.c_str());
            else if (value("LeftWheel_Load%", v)) id(load_lw) = atoi(v.c_str());
            else if (value("RightWheel_Load%", v)) id(load_rw) = atoi(v.c_str());
            else if (value("LeftWheel_PositionInMM", v)) id(pos_l) = atoi(v.c_str());
            else if (value("RightWheel_PositionInMM", v)) id(pos_r) = atoi(v.c_str());
            else if (value("SNSR_DUSTBIN_IS_IN", v)) {
              bool in = v == "1";
              if (!id(bac_en_place).has_state() || id(bac_en_place).state != in) id(bac_en_place).publish_state(in);
            }
            else if (id(pending) == 8 && line.find(',') != std::string::npos) {
              static const char *keys[] = {"LSIDEBIT", "LFRONTBIT", "RSIDEBIT", "RFRONTBIT", "LLDSBIT", "RLDSBIT",
                                           "SNSR_LEFT_WHEEL_EXTENDED", "SNSR_RIGHT_WHEEL_EXTENDED"};
              for (int i = 0; i < 8; i++) {
                if (value(keys[i], v)) {
                  if (v == "1") id(digital) |= (1 << i);
                  else id(digital) &= ~(1 << i);
                  break;
                }
              }
            }
            else if (value("CumulativeCleaningTimeInSecs", v)) id(heures_nettoyage).publish_state(strtoul(v.c_str(), nullptr, 16) / 3600.0);
            else if (id(pending) == 2 && !line.empty() && isdigit((unsigned char) line[0])) {
              id(erreur).publish_state(line);
              id(err_seen) = true;
            }
          }
          if (id(robot_booted)) {
            id(robot_booted) = false;
            id(after_robot_boot).execute();
          }
  - interval: 1s
    then:
      - lambda: |-
          if (!id(drive_req) && !id(refresh_all).is_running()) id(refresh_all).execute();
  - interval: 100ms
    then:
      - lambda: |-
          if (id(driving) && !id(drive_tick).is_running()) id(drive_tick).execute();
